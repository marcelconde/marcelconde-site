<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Categoria</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      color: #111;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2.4vw, 2.4rem);
      line-height: 1.1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
      grid-auto-rows: 220px;
    }

    .img-wrap {
      position: relative;
      z-index: 1;
      border-radius: 14px;
      overflow: hidden;
      background: #eaeaea;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      transition: transform .32s cubic-bezier(.2,.8,.2,1), box-shadow .32s cubic-bezier(.2,.8,.2,1), z-index .01s linear;
      break-inside: avoid;
      will-change: transform;
    }

    .img-wrap:hover {
      z-index: 8;
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.18);
    }

    .img-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .45s ease, filter .35s ease;
      background: #efefef;
    }

    .img-wrap:hover img {
      transform: scale(1.04);
      filter: saturate(1.04);
    }

    .img-wrap img.is-wide {
      object-fit: cover;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 24px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 0 18px;
      background: linear-gradient(to bottom, rgba(245,245,245,0.98) 65%, rgba(245,245,245,0));
      backdrop-filter: blur(8px);
    }

    .back-btn {
      appearance: none;
      border: 1px solid #ddd;
      background: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .back-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
      border-color: #ccc;
    }

    /* ===============================
       FULLSCREEN SCROLL VIEWER
    ================================ */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.92);
      display: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity .32s ease;
    }

    .lightbox[aria-hidden="false"] {
      display: block;
      opacity: 1;
    }

    .lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 30px;
      cursor: pointer;
      line-height: 1;
      z-index: 10001;
      backdrop-filter: blur(8px);
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.14);
    }

    .lightbox-counter {
      position: fixed;
      top: 22px;
      left: 22px;
      color: rgba(255,255,255,0.86);
      font-weight: 600;
      letter-spacing: .3px;
      z-index: 10001;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
    }

    .lightbox-scroll {
      height: 100vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      padding: 9vh 4vw 8vh;
    }

    .lightbox-track {
      display: grid;
      gap: 10vh;
      justify-items: center;
      padding: 12vh 0;
      transition: transform .45s ease;
      will-change: transform;
    }

    .lightbox-item {
      width: min(1200px, 92vw);
      min-height: 82vh;
      display: grid;
      place-items: center;
      scroll-snap-align: center;
      opacity: 0.32;
      transform: translateY(42px) scale(0.975);
      transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);
    }

    .lightbox-item.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .lightbox-item img {
      max-width: 100%;
      max-height: 82vh;
      width: auto;
      height: auto;
      display: block;
      border-radius: 16px;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
      background: rgba(255,255,255,0.04);
      transition: transform .5s ease, box-shadow .5s ease, opacity .45s ease;
    }

    @media (max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .topbar {
        margin-bottom: 18px;
      }

      .lightbox-scroll {
        padding: 8vh 3vw 8vh;
      }

      .lightbox-item {
        width: 94vw;
        min-height: 100vh;
        padding: 0;
      }

      .lightbox-item img {
        max-width: 94vw;
        max-height: 78vh;
      }

      .lightbox-close {
        top: 12px;
        right: 12px;
        width: 44px;
        height: 44px;
      }

      .lightbox-counter {
        top: 12px;
        left: 12px;
        font-size: .9rem;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <button class="back-btn" type="button" onclick="history.back()">← Voltar</button>
    <h1 id="title">Carregando...</h1>
  </div>
  <div class="grid" id="grid"></div>

  <!-- Viewer fullscreen com rolagem -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Fechar" type="button">×</button>
    <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
    <div class="lightbox-scroll" id="lightbox-scroll">
      <div class="lightbox-track" id="lightbox-track"></div>
    </div>
  </div>

  <script>
    const titleEl = document.getElementById("title");
    const gridEl = document.getElementById("grid");

    // ✅ SUA BASE DO WORKER (ajustado)
    const WORKER_BASE = "https://cloudinary.marcel-conde.workers.dev";

    // URL: /categoria.html?slug=drone
    const params = new URLSearchParams(location.search);
    const slug = params.get("slug");

    if (!slug) {
      titleEl.textContent = "Álbum não informado (?slug=nome-do-album)";
      throw new Error("missing slug");
    }

    // ===== Viewer fullscreen refs =====
    const lightboxEl = document.getElementById("lightbox");
    const btnClose = lightboxEl.querySelector(".lightbox-close");
    const lightboxScroll = document.getElementById("lightbox-scroll");
    const lightboxTrack = document.getElementById("lightbox-track");
    const lightboxCounter = document.getElementById("lightbox-counter");

    let currentIndex = 0;
    let currentList = [];
    let viewerObserver = null;

    function markWide(img) {
      try {
        const ratio = img.naturalWidth / img.naturalHeight;
        if (ratio > 2.2) img.classList.add("is-wide");
      } catch {}
    }

    function buildViewerItems() {
      lightboxTrack.innerHTML = "";

      currentList.forEach((src, index) => {
        const item = document.createElement("section");
        item.className = "lightbox-item";
        item.dataset.index = String(index);

        const img = document.createElement("img");
        img.src = src;
        img.alt = `${decodeURIComponent(String(slug)).replace(/\+/g, " ")} ${index + 1}`;
        img.loading = index <= 1 ? "eager" : "lazy";
        img.decoding = "async";

        item.appendChild(img);
        lightboxTrack.appendChild(item);
      });

      if (viewerObserver) viewerObserver.disconnect();

      viewerObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            const idx = Number(entry.target.dataset.index || 0);
            currentIndex = idx;
            lightboxCounter.textContent = `${idx + 1} / ${currentList.length}`;
          } else {
            entry.target.classList.remove("is-visible");
          }
        });
      }, {
        root: lightboxScroll,
        threshold: 0.62,
      });

      lightboxTrack.querySelectorAll(".lightbox-item").forEach((item) => {
        viewerObserver.observe(item);
      });
    }

    function syncViewerParallax() {
      if (!lightboxScroll) return;
      const offset = Math.min(28, lightboxScroll.scrollTop * 0.06);
      lightboxTrack.style.transform = `translateY(${-offset}px)`;
    }

    function openLightboxAt(index) {
      if (!currentList.length) return;
      currentIndex = index;

      buildViewerItems();
      lightboxEl.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      lightboxScroll.scrollTop = 0;
      syncViewerParallax();

      requestAnimationFrame(() => {
        const target = lightboxTrack.querySelector(`[data-index="${index}"]`);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      });
    }

    function closeLightbox() {
      lightboxEl.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      if (viewerObserver) {
        viewerObserver.disconnect();
        viewerObserver = null;
      }
      lightboxTrack.style.transform = "translateY(0)";
      lightboxTrack.innerHTML = "";
    }

    btnClose.addEventListener("click", closeLightbox);

    lightboxEl.addEventListener("click", (e) => {
      if (e.target === lightboxEl) closeLightbox();
    });

    lightboxScroll.addEventListener("scroll", () => {
      if (lightboxEl.getAttribute("aria-hidden") !== "false") return;
      syncViewerParallax();
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (lightboxEl.getAttribute("aria-hidden") !== "false") return;
      if (e.key === "Escape") closeLightbox();
    });

    async function load() {
      // slug pode ser:
      // - "drone" (pasta com fotos)
      // - "Eventos Esportivos" (pasta que contém subpastas)
      // - "Eventos Esportivos/Corrida" (subpasta com fotos)

      const slugDecoded = decodeURIComponent(String(slug)).replace(/\+/g, " ");
      const albumPath = `portfolio/${slugDecoded}`;

      // 1) Primeiro tenta ver se essa pasta tem subpastas
      //    (Worker novo já retorna SOMENTE subpastas diretas quando usa ?path=)
      try {
        const foldersRes = await fetch(
          `${WORKER_BASE}/albums?path=${encodeURIComponent(albumPath)}`,
          { cache: "no-store" }
        );

        if (foldersRes.ok) {
          const folders = await foldersRes.json();

          if (Array.isArray(folders) && folders.length > 0) {
            titleEl.textContent = slugDecoded;
            gridEl.innerHTML = "";
            closeLightbox();

            for (const folder of folders) {
              const folderSlug = folder.slug;
              const folderPath = folder.path;

              const childSlug = `${slugDecoded}/${folderSlug}`;

              let thumb = null;
              try {
                const albumRes = await fetch(
                  `${WORKER_BASE}/album?path=${encodeURIComponent(folderPath)}`,
                  { cache: "no-store" }
                );
                if (albumRes.ok) {
                  const albumData = await albumRes.json();
                  thumb = albumData.thumbnail || albumData.images?.[0]?.url || null;
                }
              } catch {}

              // ✅ Se não existe thumbnail, consideramos a subpasta vazia e não exibimos
              if (!thumb) continue;

              const a = document.createElement("a");
              a.className = "folder-card";
              a.href = `/categoria.html?slug=${encodeURIComponent(childSlug)}`;

              const img = document.createElement("img");
              img.src = thumb;
              img.alt = folderSlug;
              img.loading = "lazy";
              a.appendChild(img);

              const label = document.createElement("div");
              label.className = "folder-label";
              label.textContent = folderSlug;
              a.appendChild(label);

              gridEl.appendChild(a);
            }

            return;
          }
        }
      } catch (err) {
        console.warn("Falha ao listar subpastas, tentando carregar como álbum", err);
      }

      // 2) Se não tem subpastas, trata como álbum de fotos
      const url = `${WORKER_BASE}/album?path=${encodeURIComponent(albumPath)}`;

      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`Worker /album ${res.status}`);

      const data = await res.json();

      const slugTitle = slugDecoded.split("/").filter(Boolean).pop() || slugDecoded;
      titleEl.textContent = data.title || slugTitle;

      const images = (data.images || [])
        .map(i => (typeof i === "object" ? i.url : i))
        .filter(Boolean);

      const list = images.length ? images : [data.thumbnail].filter(Boolean);
      currentList = list;

      gridEl.innerHTML = "";

      if (!list.length) {
        titleEl.textContent = "Álbum vazio";
        return;
      }

      list.forEach((src, index) => {
        const wrap = document.createElement("div");
        wrap.className = "img-wrap";

        const img = document.createElement("img");
        img.src = src;
        img.loading = index < 4 ? "eager" : "lazy";
        img.decoding = "async";

        img.onload = () => {
          markWide(img);

          const ratio = img.naturalWidth / img.naturalHeight;
          if (ratio >= 1.35) {
            wrap.style.gridRow = "span 1";
          } else if (ratio <= 0.8) {
            wrap.style.gridRow = "span 2";
          } else {
            wrap.style.gridRow = "span 2";
          }
        };

        wrap.addEventListener("click", () => openLightboxAt(index));

        wrap.appendChild(img);
        gridEl.appendChild(wrap);
      });
    }

    load().catch(err => {
      console.error(err);
      titleEl.textContent = "Erro ao carregar o álbum";
    });
  </script>

</body>

</html>
