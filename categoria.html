<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0;
      padding: 24px;
      background: #111315;
      color: #f5f5f5;
    }

    :root[data-theme="light"] body {
      background: #ded2c0;
      color: #211a13;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2.2vw, 2.2rem);
      font-weight: 700;
      line-height: 1.1;
    }

    /* ─── TOP BAR ─── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 28px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 0 20px;
      background: linear-gradient(to bottom, rgba(17,19,21,0.97) 60%, rgba(17,19,21,0));
      backdrop-filter: blur(8px);
    }

    .back-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.10);
      background: #1b1d21;
      color: #f5f5f5;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
    }

    .back-btn:hover {
      transform: translateY(-1px);
      background: #22252a;
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
    }

    :root[data-theme="light"] .topbar {
      background: linear-gradient(to bottom, rgba(222,210,192,0.97) 60%, rgba(222,210,192,0));
    }

    :root[data-theme="light"] .back-btn,
    :root[data-theme="light"] .img-wrap,
    :root[data-theme="light"] .folder-card {
      background: #e9decf;
      color: #211a13;
      border-color: rgba(55,44,33,0.15);
      box-shadow: 0 10px 28px rgba(55,44,33,0.10);
    }

    .theme-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      min-height: 36px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(27,29,33,0.88);
      color: #f5f5f5;
      padding: 0 12px;
      font: 800 0.74rem system-ui, -apple-system, Segoe UI, Roboto, Arial;
      letter-spacing: 0;
      text-transform: uppercase;
      box-shadow: 0 14px 34px rgba(0,0,0,0.18);
      backdrop-filter: blur(14px);
    }

    :root[data-theme="light"] .theme-toggle {
      background: rgba(233,222,207,0.9);
      color: #211a13;
      border-color: rgba(55,44,33,0.15);
    }

    /* ─── MASONRY GRID (CSS columns) ─── */
    .grid {
      columns: 4;
      column-gap: 14px;
    }

    .img-wrap {
      break-inside: avoid;
      display: block;
      margin-bottom: 14px;
      border-radius: 6px;
      overflow: hidden;
      background: #181a1d;
      cursor: pointer;
      position: relative;
      box-shadow: 0 10px 32px rgba(0,0,0,0.28);
      transition: transform .4s cubic-bezier(.22,1,.36,1), box-shadow .4s ease;
    }

    .img-wrap:hover {
      transform: translateY(-5px) scale(1.012);
      box-shadow: 0 24px 70px rgba(0,0,0,0.42);
    }

    .img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform .55s cubic-bezier(.22,1,.36,1), filter .4s ease;
    }

    .img-wrap:hover img {
      transform: scale(1.04);
      filter: saturate(1.08) brightness(1.02);
    }

    /* ─── OVERLAY SOCIAL NAS FOTOS ─── */
    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.06) 48%, transparent 70%);
      display: flex;
      align-items: flex-end;
      padding: 10px 12px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .img-wrap:hover .photo-overlay { opacity: 1; }

    .photo-overlay-btns { display: flex; gap: 6px; align-items: center; }

    .photo-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.18);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s ease, transform 0.2s ease;
      padding: 0;
      flex-shrink: 0;
    }

    .photo-btn:hover { background: rgba(255,255,255,0.32); transform: scale(1.12); }
    .photo-heart:hover { background: rgba(220,50,50,0.45); }
    .photo-heart.liked { background: rgba(220,50,50,0.75); }
    .photo-heart.liked svg { fill: #fff; stroke: none; }

    .like-count {
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .03em;
      min-width: 16px;
      display: none;
    }

    /* ─── FOLDER CARDS ─── */
    .folder-card {
      break-inside: avoid;
      display: block;
      margin-bottom: 14px;
      border-radius: 6px;
      overflow: hidden;
      background: #181a1d;
      cursor: pointer;
      text-decoration: none;
      color: #f5f5f5;
      box-shadow: 0 10px 32px rgba(0,0,0,0.28);
      transition: transform .4s cubic-bezier(.22,1,.36,1), box-shadow .4s ease;
    }

    .folder-card:hover {
      transform: translateY(-5px) scale(1.012);
      box-shadow: 0 24px 70px rgba(0,0,0,0.42);
    }

    .folder-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: transform .55s cubic-bezier(.22,1,.36,1), filter .4s ease;
    }

    .folder-card:hover img {
      transform: scale(1.04);
      filter: saturate(1.08) brightness(1.02);
    }

    .folder-label {
      padding: 11px 14px;
      font-weight: 600;
      font-size: .88rem;
      background: #181a1d;
      color: #f5f5f5;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    /* ─── FULLSCREEN SCROLL VIEWER ─── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: #060606;
      z-index: 9999;
      display: none;
      opacity: 0;
      transition: opacity .35s ease;
    }

    /* Background mosaic of all album photos */
    .lightbox-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .lightbox-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(6,6,6,0.87);
    }

    .lightbox-bg-inner {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      will-change: transform;
    }

    .lightbox-bg-inner img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      filter: blur(1px);
    }

    .lightbox.is-open {
      display: block;
    }

    .lightbox.is-visible {
      opacity: 1;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      z-index: 10001;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease, transform .2s ease;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.14);
      transform: scale(1.06);
    }

    .lightbox-counter {
      position: fixed;
      top: 24px;
      left: 24px;
      color: rgba(255,255,255,0.72);
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .5px;
      z-index: 10001;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
    }

    .lightbox-scroll {
      position: relative;
      z-index: 1;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .lightbox-track {
      display: block;
    }

    /* Each photo occupies the full viewport and snaps into place */
    .lightbox-item {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
      padding: 72px 32px 60px;
      will-change: transform;
    }

    /* The image itself animates in when its parent becomes visible */
    .lightbox-item img {
      max-width: min(96vw, 1800px);
      max-height: 92vh;
      width: auto;
      height: auto;
      display: block;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 32px 90px rgba(0,0,0,0.55);
      /* Initial (hidden) state */
      opacity: 0;
      transform: translateY(55px) scale(0.96);
      transition:
        opacity .75s cubic-bezier(.22,1,.36,1),
        transform .75s cubic-bezier(.22,1,.36,1),
        box-shadow .55s ease;
      will-change: transform, opacity;
    }

    /* Visible state — triggered by IntersectionObserver */
    .lightbox-item.is-visible img {
      opacity: 1;
      transform: none;
      box-shadow: 0 50px 140px rgba(0,0,0,0.65);
    }

    /* ─── SCROLL HINT ─── */
    .scroll-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10001;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .5s ease;
    }

    .scroll-hint.visible {
      opacity: 1;
    }

    .scroll-hint-label {
      color: rgba(255,255,255,0.38);
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .sh-arrow {
      display: block;
      width: 22px;
      height: 22px;
      stroke: rgba(255,255,255,0.55);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: shCascade 1.3s ease-in-out infinite;
    }

    .sh-a1 { animation-delay: 0s; }
    .sh-a2 { animation-delay: 0.2s; }
    .sh-a3 { animation-delay: 0.4s; }

    @keyframes shCascade {
      0%, 100% { opacity: 0.08; transform: translateY(-3px); }
      50%       { opacity: 0.9;  transform: translateY(4px);  }
    }

    /* ─── SOCIAL SHARE BAR ─── */
    .social-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      /* Rompe o padding do body para ir borda a borda */
      margin: -14px -24px 32px;
      padding: 11px 24px;
      background: #0d0d0d;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .social-bar-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin-right: 6px;
    }

    .social-bar-divider {
      width: 1px;
      height: 14px;
      background: rgba(255,255,255,0.10);
      margin: 0 4px;
    }

    .social-bar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.09);
      background: transparent;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, color .2s ease;
    }

    .social-bar-btn:hover { color: #fff; border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); }
    .social-bar-btn svg { width: 17px; height: 17px; flex-shrink: 0; }

    .social-bar-btn.whatsapp:hover  { color: #25d366; border-color: rgba(37,211,102,0.35); background: rgba(37,211,102,0.08); }
    .social-bar-btn.instagram:hover { color: #e1306c; border-color: rgba(225,48,108,0.35); background: rgba(225,48,108,0.08); }
    .social-bar-btn.pinterest:hover { color: #e60023; border-color: rgba(230,0,35,0.35);   background: rgba(230,0,35,0.08); }

    /* ─── BOTÃO FLUTUANTE DE ORÇAMENTO ─── */
    .quote-fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 20px;
      background: #161616;
      color: #f5f5f5;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 3px;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 36px rgba(0,0,0,0.55);
      transition: background .2s, box-shadow .2s, transform .2s;
    }
    .quote-fab:hover {
      background: #202020;
      transform: translateY(-2px);
      box-shadow: 0 14px 48px rgba(0,0,0,0.65);
    }
    .quote-fab svg { width: 18px; height: 18px; flex-shrink: 0; color: #25d366; }

    /* ─── POPUP DE ORÇAMENTO ─── */
    .quote-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 600;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 0 28px 96px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .quote-overlay.open { opacity: 1; pointer-events: all; }

    .quote-popup {
      width: 320px;
      background: #141414;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 4px;
      overflow: hidden;
      transform: translateY(16px);
      transition: transform .28s cubic-bezier(.22,1,.36,1);
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
    }
    .quote-overlay.open .quote-popup { transform: none; }

    .quote-popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #0d0d0d;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .quote-popup-header span {
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }
    .quote-close {
      background: none;
      border: none;
      color: rgba(255,255,255,0.38);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      transition: color .15s;
    }
    .quote-close:hover { color: #fff; }

    .quote-popup-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quote-popup-msg {
      font-size: .8rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.5;
      margin-bottom: 2px;
    }
    .quote-input {
      width: 100%;
      padding: 10px 12px;
      background: #1c1c1c;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 3px;
      color: #f5f5f5;
      font-size: .82rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
      box-sizing: border-box;
    }
    .quote-input:focus { border-color: rgba(255,255,255,0.28); }
    .quote-input::placeholder { color: rgba(255,255,255,0.22); }
    textarea.quote-input { resize: none; height: 76px; }

    .quote-submit {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 3px;
      color: #f5f5f5;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s;
      margin-top: 2px;
    }
    .quote-submit:hover { background: #252525; }
    .quote-submit svg { width: 16px; height: 16px; color: #25d366; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 1200px) {
      .grid { columns: 3; }
    }

    @media (max-width: 800px) {
      body { padding: 16px; }
      .social-bar { margin: -14px -16px 24px; }
      .quote-fab { bottom: 18px; right: 18px; padding: 11px 16px; font-size: .76rem; }
      .quote-overlay { padding: 0 18px 80px; }
      .quote-popup { width: 290px; }
      .grid { columns: 2; column-gap: 10px; }
      .img-wrap, .folder-card { margin-bottom: 10px; }
      .lightbox-bg-inner { grid-template-columns: repeat(4, 1fr); }
      .lightbox-scroll { height: 100dvh; }
      .lightbox-item { height: 100dvh; padding: 60px 12px; }
      .lightbox-item img {
        max-width: 98vw;
        max-height: 88dvh;
      }
      .lightbox-close { top: 14px; right: 14px; width: 42px; height: 42px; font-size: 22px; }
      .lightbox-counter { top: 16px; left: 14px; font-size: .78rem; padding: 7px 12px; }
    }

    @media (max-width: 480px) {
      .grid { columns: 1; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .lightbox-item { padding: 50px 60px; height: 100vh; }
      .lightbox-item img {
        max-height: 90vh;
        max-width: 88vw;
      }
      .lightbox-bg-inner { grid-template-columns: repeat(8, 1fr); }
    }
  </style>
</head>

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738a.36.36 0 0 1 .083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.632-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
    </a>

  <!-- Botão flutuante de orçamento -->
  <button class="quote-fab" id="quote-fab" type="button">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.533 5.86L.057 23.428a.75.75 0 0 0 .915.914l5.677-1.474A11.953 11.953 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.71 9.71 0 0 1-4.952-1.355l-.355-.211-3.67.952.975-3.566-.232-.368A9.712 9.712 0 0 1 2.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/></svg>
    Pedir Orçamento
  </button>

  <!-- Popup de orçamento -->
  <div class="quote-overlay" id="quote-overlay">
    <div class="quote-popup">
      <div class="quote-popup-header">
        <span>Solicitar Orçamento</span>
        <button class="quote-close" id="quote-close" type="button">×</button>
      </div>
      <div class="quote-popup-body">
        <p class="quote-popup-msg">Preencha os dados e te retorno com o orçamento pelo WhatsApp 😊</p>
        <input class="quote-input" id="q-nome"      type="text"  placeholder="Nome *" required />
        <input class="quote-input" id="q-telefone"  type="tel"   placeholder="Telefone / WhatsApp *" required />
        <input class="quote-input" id="q-email"     type="email" placeholder="E-mail" />
        <textarea class="quote-input" id="q-msg"    placeholder="Sobre o trabalho (evento, data, local...)"></textarea>
        <button class="quote-submit" id="quote-submit" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.533 5.86L.057 23.428a.75.75 0 0 0 .915.914l5.677-1.474A11.953 11.953 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.71 9.71 0 0 1-4.952-1.355l-.355-.211-3.67.952.975-3.566-.232-.368A9.712 9.712 0 0 1 2.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/></svg>
          Enviar via WhatsApp
        </button>
      </div>

  <div class="grid" id="grid"></div>

  <!-- Fullscreen scroll viewer -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de fotos">
    <div class="lightbox-bg" aria-hidden="true">
      <div id="lightbox-bg-inner" class="lightbox-bg-inner"></div>
    </div>
    <button class="lightbox-close" id="btn-close" aria-label="Fechar" type="button">×</button>
    <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
    <div class="lightbox-scroll" id="lightbox-scroll">
      <div class="lightbox-track" id="lightbox-track"></div>
    </div>
    <div class="scroll-hint" id="scroll-hint">
      <span class="scroll-hint-label">role para ver mais</span>
      <svg class="sh-arrow sh-a1" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      <svg class="sh-arrow sh-a2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      <svg class="sh-arrow sh-a3" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>

  <script>
    const titleEl  = document.getElementById("title");
    const gridEl   = document.getElementById("grid");
    const WORKER_BASE = "https://api.marcelconde.com.br";

    const params      = new URLSearchParams(location.search);
    const slug        = params.get("slug");
    // adminToken é opaco para o front-end — o Worker valida contra a secret criptografada
    const adminToken  = params.get("admin") || "";

    // Monta o link de compartilhamento do WhatsApp com a URL limpa do álbum (sem ?admin=)
    const shareUrl = new URL(location.href);
    shareUrl.searchParams.delete("admin");
    const whatsappBtn = document.getElementById("whatsapp-btn");
    if (whatsappBtn) {
      whatsappBtn.href = `https://wa.me/?text=${encodeURIComponent("Veja esse álbum de fotos! " + shareUrl.toString())}`;
    }

    // ─── Popup de orçamento ───
    const quoteFab     = document.getElementById("quote-fab");
    const quoteOverlay = document.getElementById("quote-overlay");
    const quoteClose   = document.getElementById("quote-close");
    const quoteSubmit  = document.getElementById("quote-submit");

    quoteFab.addEventListener("click", () => quoteOverlay.classList.add("open"));
    quoteClose.addEventListener("click", () => quoteOverlay.classList.remove("open"));
    quoteOverlay.addEventListener("click", (e) => {
      if (e.target === quoteOverlay) quoteOverlay.classList.remove("open");
    });

    quoteSubmit.addEventListener("click", () => {
      const nome     = document.getElementById("q-nome").value.trim();
      const telefone = document.getElementById("q-telefone").value.trim();
      const email    = document.getElementById("q-email").value.trim();
      const msg      = document.getElementById("q-msg").value.trim();

      if (!nome || !telefone) {
        document.getElementById("q-nome").style.borderColor     = nome     ? "" : "rgba(220,50,50,0.6)";
        document.getElementById("q-telefone").style.borderColor = telefone ? "" : "rgba(220,50,50,0.6)";
        return;
      }

      const albumAtual = document.getElementById("title").textContent || "portfólio";
      let texto = `Olá Marcel! Vi o álbum "${albumAtual}" e gostaria de um orçamento.\n\n`;
      texto += `Nome: ${nome}\n`;
      texto += `Telefone: ${telefone}\n`;
      if (email)    texto += `E-mail: ${email}\n`;
      if (msg)      texto += `\nDetalhes: ${msg}`;

      window.open(`https://wa.me/5581984094212?text=${encodeURIComponent(texto)}`, "_blank", "noopener,noreferrer");
      quoteOverlay.classList.remove("open");
    });

    if (!slug) {
      titleEl.textContent = "Álbum não informado (?slug=nome-do-album)";
      throw new Error("missing slug");
    }

    // ─── Viewer refs ───
    const lightboxEl      = document.getElementById("lightbox");
    const btnClose        = document.getElementById("btn-close");
    const lightboxScroll  = document.getElementById("lightbox-scroll");
    const lightboxTrack   = document.getElementById("lightbox-track");
    const lightboxCounter = document.getElementById("lightbox-counter");
    const scrollHintEl    = document.getElementById("scroll-hint");
    const lightboxBgInner = document.getElementById("lightbox-bg-inner");

    let currentIndex = 0;
    let currentList  = [];
    let viewerObserver = null;
    let cachedItemPositions = [];

    // Injeta transforms Cloudinary sem duplicar — reduz tamanho das imagens em 70-90%
    function cloudUrl(src, t) {
      if (!src || !src.includes('/upload/')) return src;
      return src.replace(/\/upload\/(?:[a-z]+_[^,/]+(?:,[a-z]+_[^,/]+)*\/)?/, `/upload/${t}/`);
    }

    function buildBg() {
      if (!lightboxBgInner || !currentList.length) return;
      lightboxBgInner.innerHTML = "";
      lightboxBgInner.style.transform = "";
      const needed = 96; // 6 cols × 16 rows — cobre viewport + margem para parallax em álbuns longos
      for (let i = 0; i < needed; i++) {
        const img = document.createElement("img");
        img.src = cloudUrl(currentList[i % currentList.length], 'f_auto,q_auto,w_200,h_200,c_fill');
        img.loading = i < 18 ? "eager" : "lazy";
        img.decoding = "async";
        img.alt = "";
        lightboxBgInner.appendChild(img);
      }
    }

    function syncBgParallax() {
      if (!lightboxBgInner) return;
      const shift = lightboxScroll.scrollTop * 0.08;
      lightboxBgInner.style.transform = `translateY(-${shift}px)`;
    }

    // ─── Build viewer items ───
    function buildViewerItems() {
      lightboxTrack.innerHTML = "";

      currentList.forEach((src, index) => {
        const item = document.createElement("section");
        item.className = "lightbox-item";
        item.dataset.index = String(index);

        const img = document.createElement("img");
        img.src = cloudUrl(src, 'f_auto,q_auto,w_1400');
        img.alt = `${decodeURIComponent(String(slug)).replace(/\+/g, " ")} ${index + 1}`;
        img.loading = index <= 1 ? "eager" : "lazy";
        img.decoding = "async";

        item.appendChild(img);
        lightboxTrack.appendChild(item);
      });

      if (viewerObserver) viewerObserver.disconnect();

      viewerObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            const idx = Number(entry.target.dataset.index || 0);
            currentIndex = idx;
            lightboxCounter.textContent = `${idx + 1} / ${currentList.length}`;
          } else {
            entry.target.classList.remove("is-visible");
          }
        });
        requestAnimationFrame(syncParallax);
      }, {
        root: lightboxScroll,
        threshold: 0.5,
      });

      lightboxTrack.querySelectorAll(".lightbox-item").forEach((item) => {
        viewerObserver.observe(item);
      });
    }

    // Lê offsetTop uma vez após build para não causar reflow a cada frame de scroll
    function cacheParallaxPositions() {
      cachedItemPositions = Array.from(
        lightboxTrack.querySelectorAll('.lightbox-item')
      ).map(item => ({ el: item, center: item.offsetTop + item.offsetHeight / 2 }));
    }

    function syncParallax() {
      if (!lightboxScroll || !cachedItemPositions.length) return;
      const vh = lightboxScroll.clientHeight || window.innerHeight;
      const centerY = lightboxScroll.scrollTop + vh / 2;

      cachedItemPositions.forEach(({ el, center }) => {
        const distance = (center - centerY) / vh;
        const shift = Math.max(-18, Math.min(18, distance * 26));
        const scale = 1 - Math.min(0.035, Math.abs(distance) * 0.045);
        el.style.transform = `translateY(${shift}px) scale(${scale})`;
      });
    }

    // ─── Open / close ───
    function openLightboxAt(index) {
      if (!currentList.length) return;
      currentIndex = index;

      buildViewerItems();
      cacheParallaxPositions();
      buildBg();

      lightboxEl.classList.add("is-open");
      document.body.style.overflow = "hidden";
      lightboxScroll.scrollTop = 0;

      if (currentList.length > 1) scrollHintEl.classList.add("visible");

      requestAnimationFrame(() => {
        lightboxEl.classList.add("is-visible");
        // Scroll to the clicked photo (if not the first)
        if (index > 0) {
          const target = lightboxTrack.querySelector(`[data-index="${index}"]`);
          if (target) {
            setTimeout(() => {
              target.scrollIntoView({ behavior: "smooth", block: "start" });
            }, 60);
          }
        }
        requestAnimationFrame(syncParallax);
      });
    }

    function closeLightbox() {
      lightboxEl.classList.remove("is-visible");
      document.body.style.overflow = "";
      scrollHintEl.classList.remove("visible");

      setTimeout(() => {
        lightboxEl.classList.remove("is-open");
        if (viewerObserver) {
          viewerObserver.disconnect();
          viewerObserver = null;
        }
        lightboxTrack.innerHTML = "";
        lightboxBgInner.innerHTML = "";
      }, 360);
    }

    btnClose.addEventListener("click", closeLightbox);

    lightboxEl.addEventListener("click", (e) => {
      if (e.target === lightboxEl) closeLightbox();
    });

    lightboxScroll.addEventListener("scroll", () => {
      if (!lightboxEl.classList.contains("is-open")) return;
      requestAnimationFrame(syncParallax);
      requestAnimationFrame(syncBgParallax);
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (!lightboxEl.classList.contains("is-open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowDown" || e.key === "ArrowRight") {
        const next = lightboxTrack.querySelector(`[data-index="${currentIndex + 1}"]`);
        if (next) next.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
        const prev = lightboxTrack.querySelector(`[data-index="${currentIndex - 1}"]`);
        if (prev) prev.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    // ─── Load album from worker ───
    async function load() {
      const slugDecoded = decodeURIComponent(String(slug)).replace(/\+/g, " ");
      const albumPath   = `portfolio/${slugDecoded}`;

      // 1) Check if this path has sub-folders
      try {
        const foldersRes = await fetch(
          `${WORKER_BASE}/albums?path=${encodeURIComponent(albumPath)}&refresh=1`,
          { cache: "no-store" }
        );

        if (foldersRes.ok) {
          const folders = await foldersRes.json();

          if (Array.isArray(folders) && folders.length > 0) {
            titleEl.textContent = slugDecoded;
            gridEl.innerHTML    = "";

            for (const folder of folders) {
              const folderSlug = folder.slug;
              const folderPath = folder.path;
              const childSlug  = `${slugDecoded}/${folderSlug}`;

              let thumb = null;
              try {
                const albumRes = await fetch(
                  `${WORKER_BASE}/album?path=${encodeURIComponent(folderPath)}&refresh=1`,
                  { cache: "no-store" }
                );
                if (albumRes.ok) {
                  const albumData = await albumRes.json();
                  thumb = albumData.thumbnail || albumData.images?.[0]?.url || null;
                }
              } catch {}

              if (!thumb) continue;

              const a     = document.createElement("a");
              a.className = "folder-card";
              a.href      = `/categoria.html?slug=${encodeURIComponent(childSlug)}`;

              const img   = document.createElement("img");
              img.src     = cloudUrl(thumb, 'f_auto,q_auto,w_600');
              img.alt     = folderSlug;
              img.loading = "lazy";
              a.appendChild(img);

              const label          = document.createElement("div");
              label.className      = "folder-label";
              label.textContent    = folderSlug;
              a.appendChild(label);

              gridEl.appendChild(a);
            }
            return;
          }
        }
      } catch (err) {
        console.warn("Falha ao listar subpastas, tentando carregar como álbum", err);
      }

      // 2) No sub-folders — load as photo album
      const res = await fetch(
        `${WORKER_BASE}/album?path=${encodeURIComponent(albumPath)}&refresh=1`,
        { cache: "no-store" }
      );
      if (!res.ok) throw new Error(`Worker /album ${res.status}`);

      const data = await res.json();

      const slugTitle = slugDecoded.split("/").filter(Boolean).pop() || slugDecoded;
      titleEl.textContent = data.title || slugTitle;

      const imageItems = (data.images || [])
        .map(i => (typeof i === "object" ? i : { url: i }))
        .filter(i => i && i.url);

      const fallbackItems = data.thumbnail ? [{ url: data.thumbnail, public_id: "", display_name: "" }] : [];
      const list  = imageItems.length ? imageItems : fallbackItems;
      currentList = list.map(item => item.url);

      gridEl.innerHTML = "";

      if (!list.length) {
        titleEl.textContent = "Álbum vazio";
        return;
      }

      list.forEach((item, index) => {
        const src = item.url;
        const publicId = item.public_id || "";
        const wrap = document.createElement("div");
        wrap.className = "img-wrap";

        const img    = document.createElement("img");
        img.src      = cloudUrl(src, 'f_auto,q_auto,w_900');
        img.loading  = index < 4 ? "eager" : "lazy";
        img.decoding = "async";
        img.alt      = `${slugTitle} ${index + 1}`;

        // Overlay com botões sociais
        const overlay = document.createElement("div");
        overlay.className = "photo-overlay";
        overlay.innerHTML = `
          <div class="photo-overlay-btns">
            <button class="photo-btn photo-social" data-url="https://www.instagram.com/mconde.foto/" aria-label="Instagram">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><circle cx="17.5" cy="6.5" r=".5" fill="currentColor"/></svg>
            </button>
            <button class="photo-btn photo-social" data-url="https://br.pinterest.com/marcelconde/" aria-label="Pinterest">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738a.36.36 0 0 1 .083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.632-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
            </button>
            <button class="photo-btn photo-heart" aria-label="Curtir">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
            <span class="like-count" id="lc-${index}"></span>
          </div>`;

        const likedKey = `liked:${slugDecoded}:${publicId || index}`;
        const alreadyLiked = localStorage.getItem(likedKey) === '1';
        const heartBtn = overlay.querySelector(".photo-heart");
        const countEl  = overlay.querySelector(".like-count");
        if (alreadyLiked) heartBtn.classList.add("liked");

        overlay.querySelectorAll(".photo-social").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            window.open(btn.dataset.url, "_blank", "noopener,noreferrer");
          });
        });

        heartBtn.addEventListener("click", async e => {
          e.stopPropagation();
          if (localStorage.getItem(likedKey) === '1') {
            // Já curtiu: só alterna visual, não decrementa backend
            heartBtn.classList.toggle("liked");
            return;
          }
          // Primeira curtida: salva localmente e manda pro servidor
          heartBtn.classList.add("liked");
          localStorage.setItem(likedKey, '1');
          try {
            const headers = { 'content-type': 'application/json' };
            if (adminToken) headers['X-Admin-Token'] = adminToken;
            const r = await fetch(`${WORKER_BASE}/like`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ album: slugDecoded, albumName: titleEl.textContent, index, publicId })
            });
            if (r.ok) {
              const { likes, isAdmin: adminConfirmed } = await r.json();
              // Só exibe contagem se o Worker confirmou que o token é válido
              if (adminConfirmed && countEl && likes > 0) { countEl.textContent = likes; countEl.style.display = 'inline'; }
            }
          } catch {}
        });

        wrap.addEventListener("click", () => openLightboxAt(index));
        wrap.appendChild(img);
        wrap.appendChild(overlay);
        gridEl.appendChild(wrap);
      });

      // Busca curtidas — token enviado via header; Worker decide se é admin válido
      if (adminToken) {
        fetch(`${WORKER_BASE}/likes?album=${encodeURIComponent(slugDecoded)}`, {
          headers: { 'X-Admin-Token': adminToken }
        })
          .then(r => r.ok ? r.json() : {})
          .then(({ _authorized, _byAsset = {}, ...counts }) => {
            if (!_authorized) return; // token inválido — Worker rejeitou
            list.forEach((item, idx) => {
              const count = Math.max(
                Number(item.public_id ? _byAsset[item.public_id] || 0 : 0),
                Number(counts[String(idx)] || 0)
              );
              if (count > 0) {
                const el = document.getElementById(`lc-${idx}`);
                if (el) { el.textContent = count; el.style.display = 'inline'; }
              }
            });
          })
          .catch(() => {});
      }
    }
