<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Categoria</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0;
      padding: 24px;
      background: #f4f4f4;
      color: #111;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2.2vw, 2.2rem);
      font-weight: 700;
      line-height: 1.1;
    }

    /* ─── TOP BAR ─── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 28px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 0 20px;
      background: linear-gradient(to bottom, rgba(244,244,244,0.97) 60%, rgba(244,244,244,0));
      backdrop-filter: blur(8px);
    }

    .back-btn {
      appearance: none;
      border: 1px solid #ddd;
      background: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .back-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,.09);
    }

    /* ─── MASONRY GRID (CSS columns) ─── */
    .grid {
      columns: 4;
      column-gap: 14px;
    }

    .img-wrap {
      break-inside: avoid;
      display: block;
      margin-bottom: 14px;
      border-radius: 6px;
      overflow: hidden;
      background: #e4e4e4;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: transform .4s cubic-bezier(.22,1,.36,1), box-shadow .4s ease;
    }

    .img-wrap:hover {
      transform: translateY(-5px) scale(1.012);
      box-shadow: 0 18px 52px rgba(0,0,0,0.15);
    }

    .img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform .55s cubic-bezier(.22,1,.36,1), filter .4s ease;
    }

    .img-wrap:hover img {
      transform: scale(1.04);
      filter: saturate(1.08) brightness(1.02);
    }

    /* ─── FOLDER CARDS ─── */
    .folder-card {
      break-inside: avoid;
      display: block;
      margin-bottom: 14px;
      border-radius: 6px;
      overflow: hidden;
      background: #e4e4e4;
      cursor: pointer;
      text-decoration: none;
      color: #111;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: transform .4s cubic-bezier(.22,1,.36,1), box-shadow .4s ease;
    }

    .folder-card:hover {
      transform: translateY(-5px) scale(1.012);
      box-shadow: 0 18px 52px rgba(0,0,0,0.15);
    }

    .folder-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: transform .55s cubic-bezier(.22,1,.36,1), filter .4s ease;
    }

    .folder-card:hover img {
      transform: scale(1.04);
      filter: saturate(1.08) brightness(1.02);
    }

    .folder-label {
      padding: 11px 14px;
      font-weight: 600;
      font-size: .88rem;
      background: #fff;
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    /* ─── FULLSCREEN SCROLL VIEWER ─── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: #0c0c0c;
      z-index: 9999;
      display: none;
      opacity: 0;
      transition: opacity .35s ease;
    }

    .lightbox.is-open {
      display: block;
    }

    .lightbox.is-visible {
      opacity: 1;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      z-index: 10001;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease, transform .2s ease;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.14);
      transform: scale(1.06);
    }

    .lightbox-counter {
      position: fixed;
      top: 24px;
      left: 24px;
      color: rgba(255,255,255,0.72);
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .5px;
      z-index: 10001;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
    }

    .lightbox-scroll {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .lightbox-track {
      display: block;
    }

    /* Each photo occupies the full viewport and snaps into place */
    .lightbox-item {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
      padding: 72px 32px 60px;
      will-change: transform;
    }

    /* The image itself animates in when its parent becomes visible */
    .lightbox-item img {
      max-width: min(92vw, 1500px);
      max-height: 84vh;
      width: auto;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 32px 90px rgba(0,0,0,0.55);
      /* Initial (hidden) state */
      opacity: 0;
      transform: translateY(55px) scale(0.96);
      transition:
        opacity .75s cubic-bezier(.22,1,.36,1),
        transform .75s cubic-bezier(.22,1,.36,1),
        box-shadow .55s ease;
      will-change: transform, opacity;
    }

    /* Visible state — triggered by IntersectionObserver */
    .lightbox-item.is-visible img {
      opacity: 1;
      transform: none;
      box-shadow: 0 50px 140px rgba(0,0,0,0.65);
    }

    /* ─── SCROLL HINT ─── */
    .scroll-hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10001;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .5s ease;
    }

    .scroll-hint.visible {
      opacity: 1;
    }

    .sh-arrow {
      display: block;
      width: 24px;
      height: 24px;
      stroke: rgba(255,255,255,0.7);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: shCascade 1.5s ease-in-out infinite;
    }

    .sh-a1 { animation-delay: 0s; }
    .sh-a2 { animation-delay: 0.2s; }
    .sh-a3 { animation-delay: 0.4s; }

    @keyframes shCascade {
      0%, 100% { opacity: 0.15; transform: translateY(-3px); }
      50%       { opacity: 1;    transform: translateY(3px);  }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 1200px) {
      .grid { columns: 3; }
    }

    @media (max-width: 800px) {
      body { padding: 16px; }
      .grid { columns: 2; column-gap: 10px; }
      .img-wrap, .folder-card { margin-bottom: 10px; }
      .lightbox-item { padding: 56px 16px 50px; }
      .lightbox-item img { max-width: 96vw; max-height: 78vh; }
      .lightbox-close { top: 14px; right: 14px; width: 42px; height: 42px; font-size: 22px; }
      .lightbox-counter { top: 16px; left: 14px; font-size: .78rem; padding: 7px 12px; }
    }

    @media (max-width: 480px) {
      .grid { columns: 1; }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <button class="back-btn" type="button" onclick="history.back()">← Voltar</button>
    <h1 id="title">Carregando...</h1>
  </div>

  <div class="grid" id="grid"></div>

  <!-- Fullscreen scroll viewer -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de fotos">
    <button class="lightbox-close" id="btn-close" aria-label="Fechar" type="button">×</button>
    <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
    <div class="lightbox-scroll" id="lightbox-scroll">
      <div class="lightbox-track" id="lightbox-track"></div>
    </div>
    <div class="scroll-hint" id="scroll-hint">
      <svg class="sh-arrow sh-a1" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      <svg class="sh-arrow sh-a2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      <svg class="sh-arrow sh-a3" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>

  <script>
    const titleEl  = document.getElementById("title");
    const gridEl   = document.getElementById("grid");
    const WORKER_BASE = "https://cloudinary.marcel-conde.workers.dev";

    const params = new URLSearchParams(location.search);
    const slug   = params.get("slug");

    if (!slug) {
      titleEl.textContent = "Álbum não informado (?slug=nome-do-album)";
      throw new Error("missing slug");
    }

    // ─── Viewer refs ───
    const lightboxEl     = document.getElementById("lightbox");
    const btnClose       = document.getElementById("btn-close");
    const lightboxScroll = document.getElementById("lightbox-scroll");
    const lightboxTrack  = document.getElementById("lightbox-track");
    const lightboxCounter = document.getElementById("lightbox-counter");
    const scrollHintEl   = document.getElementById("scroll-hint");

    let currentIndex = 0;
    let currentList  = [];
    let viewerObserver = null;
    let scrollHintTimer = null;

    // ─── Build viewer items ───
    function buildViewerItems() {
      lightboxTrack.innerHTML = "";

      currentList.forEach((src, index) => {
        const item = document.createElement("section");
        item.className = "lightbox-item";
        item.dataset.index = String(index);

        const img = document.createElement("img");
        img.src = src;
        img.alt = `${decodeURIComponent(String(slug)).replace(/\+/g, " ")} ${index + 1}`;
        img.loading = index <= 1 ? "eager" : "lazy";
        img.decoding = "async";

        item.appendChild(img);
        lightboxTrack.appendChild(item);
      });

      if (viewerObserver) viewerObserver.disconnect();

      viewerObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            const idx = Number(entry.target.dataset.index || 0);
            currentIndex = idx;
            lightboxCounter.textContent = `${idx + 1} / ${currentList.length}`;
            // Hide scroll hint once user scrolls past the first photo
            if (idx > 0) {
              clearTimeout(scrollHintTimer);
              scrollHintEl.classList.remove("visible");
            }
          } else {
            entry.target.classList.remove("is-visible");
          }
        });
        requestAnimationFrame(syncParallax);
      }, {
        root: lightboxScroll,
        threshold: 0.5,
      });

      lightboxTrack.querySelectorAll(".lightbox-item").forEach((item) => {
        viewerObserver.observe(item);
      });
    }

    // Subtle parallax on item containers — keeps images feeling "alive" while scrolling
    function syncParallax() {
      if (!lightboxScroll) return;
      const vh = lightboxScroll.clientHeight || window.innerHeight;
      const centerY = lightboxScroll.scrollTop + vh / 2;

      lightboxTrack.querySelectorAll(".lightbox-item").forEach((item) => {
        const itemCenter = item.offsetTop + item.offsetHeight / 2;
        const distance = (itemCenter - centerY) / vh;
        const shift = Math.max(-18, Math.min(18, distance * 26));
        const scale = 1 - Math.min(0.035, Math.abs(distance) * 0.045);
        item.style.transform = `translateY(${shift}px) scale(${scale})`;
      });
    }

    // ─── Open / close ───
    function openLightboxAt(index) {
      if (!currentList.length) return;
      currentIndex = index;

      buildViewerItems();

      lightboxEl.classList.add("is-open");
      document.body.style.overflow = "hidden";
      lightboxScroll.scrollTop = 0;

      // Show scroll hint only when there are multiple photos
      if (currentList.length > 1) {
        clearTimeout(scrollHintTimer);
        scrollHintEl.classList.add("visible");
        scrollHintTimer = setTimeout(() => scrollHintEl.classList.remove("visible"), 3500);
      }

      requestAnimationFrame(() => {
        lightboxEl.classList.add("is-visible");
        // Scroll to the clicked photo (if not the first)
        if (index > 0) {
          const target = lightboxTrack.querySelector(`[data-index="${index}"]`);
          if (target) {
            setTimeout(() => {
              target.scrollIntoView({ behavior: "smooth", block: "start" });
            }, 60);
          }
        }
        requestAnimationFrame(syncParallax);
      });
    }

    function closeLightbox() {
      lightboxEl.classList.remove("is-visible");
      document.body.style.overflow = "";
      clearTimeout(scrollHintTimer);
      scrollHintEl.classList.remove("visible");

      setTimeout(() => {
        lightboxEl.classList.remove("is-open");
        if (viewerObserver) {
          viewerObserver.disconnect();
          viewerObserver = null;
        }
        lightboxTrack.innerHTML = "";
      }, 360);
    }

    btnClose.addEventListener("click", closeLightbox);

    lightboxEl.addEventListener("click", (e) => {
      if (e.target === lightboxEl) closeLightbox();
    });

    lightboxScroll.addEventListener("scroll", () => {
      if (!lightboxEl.classList.contains("is-open")) return;
      requestAnimationFrame(syncParallax);
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (!lightboxEl.classList.contains("is-open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowDown" || e.key === "ArrowRight") {
        const next = lightboxTrack.querySelector(`[data-index="${currentIndex + 1}"]`);
        if (next) next.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
        const prev = lightboxTrack.querySelector(`[data-index="${currentIndex - 1}"]`);
        if (prev) prev.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    // ─── Load album from worker ───
    async function load() {
      const slugDecoded = decodeURIComponent(String(slug)).replace(/\+/g, " ");
      const albumPath   = `portfolio/${slugDecoded}`;

      // 1) Check if this path has sub-folders
      try {
        const foldersRes = await fetch(
          `${WORKER_BASE}/albums?path=${encodeURIComponent(albumPath)}`,
          { cache: "no-store" }
        );

        if (foldersRes.ok) {
          const folders = await foldersRes.json();

          if (Array.isArray(folders) && folders.length > 0) {
            titleEl.textContent = slugDecoded;
            gridEl.innerHTML    = "";

            for (const folder of folders) {
              const folderSlug = folder.slug;
              const folderPath = folder.path;
              const childSlug  = `${slugDecoded}/${folderSlug}`;

              let thumb = null;
              try {
                const albumRes = await fetch(
                  `${WORKER_BASE}/album?path=${encodeURIComponent(folderPath)}`,
                  { cache: "no-store" }
                );
                if (albumRes.ok) {
                  const albumData = await albumRes.json();
                  thumb = albumData.thumbnail || albumData.images?.[0]?.url || null;
                }
              } catch {}

              if (!thumb) continue;

              const a     = document.createElement("a");
              a.className = "folder-card";
              a.href      = `/categoria.html?slug=${encodeURIComponent(childSlug)}`;

              const img   = document.createElement("img");
              img.src     = thumb;
              img.alt     = folderSlug;
              img.loading = "lazy";
              a.appendChild(img);

              const label          = document.createElement("div");
              label.className      = "folder-label";
              label.textContent    = folderSlug;
              a.appendChild(label);

              gridEl.appendChild(a);
            }
            return;
          }
        }
      } catch (err) {
        console.warn("Falha ao listar subpastas, tentando carregar como álbum", err);
      }

      // 2) No sub-folders — load as photo album
      const res = await fetch(
        `${WORKER_BASE}/album?path=${encodeURIComponent(albumPath)}`,
        { cache: "no-store" }
      );
      if (!res.ok) throw new Error(`Worker /album ${res.status}`);

      const data = await res.json();

      const slugTitle = slugDecoded.split("/").filter(Boolean).pop() || slugDecoded;
      titleEl.textContent = data.title || slugTitle;

      const images = (data.images || [])
        .map(i => (typeof i === "object" ? i.url : i))
        .filter(Boolean);

      const list  = images.length ? images : [data.thumbnail].filter(Boolean);
      currentList = list;

      gridEl.innerHTML = "";

      if (!list.length) {
        titleEl.textContent = "Álbum vazio";
        return;
      }

      list.forEach((src, index) => {
        const wrap = document.createElement("div");
        wrap.className = "img-wrap";

        const img       = document.createElement("img");
        img.src         = src;
        img.loading     = index < 4 ? "eager" : "lazy";
        img.decoding    = "async";
        img.alt         = `${slugTitle} ${index + 1}`;

        wrap.addEventListener("click", () => openLightboxAt(index));
        wrap.appendChild(img);
        gridEl.appendChild(wrap);
      });
    }

    load().catch(err => {
      console.error(err);
      titleEl.textContent = "Erro ao carregar o álbum";
    });
  </script>

</body>

</html>
