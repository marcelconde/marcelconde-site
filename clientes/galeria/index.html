<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Galeria privada | Marcel Conde Fotografia</title>
  <link rel="icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/clientes/galeria/galeria.css">
</head>
<body>
  <header class="client-topbar">
    <a class="brand" href="/">
      <span>MC</span>
      <strong>Marcel Conde</strong>
    </a>
    <div class="selection-counter" id="selectionCounter">0 selecionadas</div>
  </header>

  <main>
    <section class="gallery-hero" id="galleryHero">
      <div class="gallery-hero-bg" id="galleryHeroBg"></div>
      <div class="gallery-hero-content">
        <span class="eyebrow">Galeria privada</span>
        <h1 id="galleryTitle">Carregando galeria</h1>
        <p id="gallerySubtitle"></p>
        <div class="gallery-message" id="galleryMessage"></div>
        <div class="gallery-actions">
          <button class="btn btn-primary" id="completeBtn" type="button">Concluir seleção</button>
          <button class="btn btn-primary hidden" id="downloadAllBtn" type="button">Baixar todas</button>
          <span id="galleryLimit"></span>
        </div>
      </div>
    </section>

    <section class="gallery-body">
      <div class="photo-grid" id="photoGrid"></div>
      <div class="load-sentinel" id="loadSentinel">Carregando fotos...</div>
    </section>
  </main>

  <div class="lightbox hidden" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" type="button">Fechar</button>
    <button class="lightbox-heart" id="lightboxHeart" type="button">♡</button>
    <div class="lightbox-stage" id="lightboxStage"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/clientes/galeria/galeria.js?v=20260609-01"></script>
</body>
</html>
