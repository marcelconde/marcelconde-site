<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Minhas galerias | Marcel Conde Fotografia</title>
  <link rel="icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/clientes/auth.css?v=20260716-01">
</head>
<body>
  <main class="client-shell">
    <header class="client-top">
      <a class="brand" href="/">
        <span>MC</span>
        <strong>Marcel Conde</strong>
      </a>
      <button class="btn" id="logoutBtn" type="button">Sair</button>
    </header>

    <section class="dashboard-head">
      <div>
        <span class="eyebrow">Área do cliente</span>
        <h1>Sua área</h1>
        <p id="clientLabel">Carregando acesso...</p>
      </div>
      <a class="btn" href="/encontre/">Outras plataformas</a>
    </section>

    <section class="dashboard-section" id="quoteSection">
      <header class="dashboard-section-head">
        <span class="eyebrow">Propostas</span>
        <h2>Orçamentos e contratos</h2>
      </header>
      <div class="quote-list" id="quoteList"></div>
    </section>

    <section class="dashboard-section">
      <header class="dashboard-section-head">
        <span class="eyebrow">Entregas</span>
        <h2>Galerias</h2>
      </header>
      <div class="gallery-list" id="galleryList"></div>
    </section>
  </main>

  <script src="/theme.js?v=20260716-01"></script>
  <script src="/clientes/dashboard/dashboard.js?v=20260714-01"></script>
</body>
</html>
