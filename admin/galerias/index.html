<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Galerias privadas — Admin Marcel Conde</title>
  <link rel="icon" href="/images/favicon.png">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <meta name="theme-color" content="#0d0e0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MC Painel">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="/images/admin-icon-180.png">
  <script src="/pwa.js?v=20261120-01" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=20260716-02">
  <link rel="stylesheet" href="/admin/private-admin.css?v=20260716-02">
  <link rel="stylesheet" href="/admin/ui.css?v=20261120-03">
</head>
<body class="gallery-index-page">
  <div class="admin-shell app" id="adminShell">
    <aside id="appSidebar" data-active="galerias"></aside>
    <script src="/admin/shell.js?v=20261120-03"></script>
    <div class="app-main">

    <main class="private-admin gallery-library">
      <section class="library-hero">
        <div>
          <span class="eyebrow">Trabalhos</span>
          <h1>Galerias</h1>
          <p>Escolha uma galeria para abrir o painel de fotos, upload, preços e configurações.</p>
          <div class="stats page-stats">
            <div><strong id="statGalleries">0</strong><span>Galerias</span></div>
            <div><strong id="statPhotos">0</strong><span>Fotos</span></div>
            <div><strong id="statSelected">0</strong><span>Selecionadas</span></div>
          </div>
        </div>
        <button class="icon-btn" id="refreshBtn" type="button" title="Atualizar">↻</button>
      </section>

      <section class="library-toolbar" aria-label="Criar e buscar galerias">
        <label for="quickTitle">
          Nova galeria
          <span>Crie a galeria aqui; os detalhes serão editados na próxima página.</span>
        </label>
        <div class="inline-form">
          <input id="quickTitle" type="text" placeholder="Ex: Beatriz Formatura">
          <button class="btn btn-primary" id="quickCreateBtn" type="button">Criar galeria</button>
        </div>
        <label class="gallery-search-field" for="gallerySearch">
          Buscar galeria
          <span>Digite nome, cliente, slug ou ID da galeria.</span>
          <input id="gallerySearch" type="search" placeholder="Ex: ASICS, Katarina ou gal_ZDT..." autocomplete="off">
        </label>
      </section>

      <section class="gallery-card-grid" id="galleryList" aria-label="Galerias disponíveis"></section>
    </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/theme.js?v=20260915-03"></script>
  <script src="/admin/galerias/lista.js?v=20261116-01"></script>
</body>
</html>
