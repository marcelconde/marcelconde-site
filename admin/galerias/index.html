<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Galerias privadas — Admin Marcel Conde</title>
  <link rel="icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=20260707-05">
  <link rel="stylesheet" href="/admin/private-admin.css?v=20260707-05">
</head>
<body class="gallery-index-page">
  <div class="admin-shell" id="adminShell">
    <header class="topbar">
      <a class="brand" href="/admin/" aria-label="Voltar para o admin">
        <span>MC</span>
        <strong>Galerias</strong>
      </a>
      <div class="stats">
        <div><strong id="statGalleries">0</strong><span>Galerias</span></div>
        <div><strong id="statPhotos">0</strong><span>Fotos</span></div>
        <div><strong id="statSelected">0</strong><span>Selecionadas</span></div>
      </div>
      <div class="top-actions">
        <span class="user-pill" id="currentUserLabel"></span>
        <a class="btn btn-ghost" href="/admin/clientes/">Clientes</a>
        <a class="btn btn-ghost" href="/admin/">Admin</a>
      </div>
    </header>

    <nav class="tabs" aria-label="Seções do admin">
      <a class="tab" href="/admin/">Portfólios</a>
      <a class="tab" href="/admin/clientes/">Clientes</a>
      <a class="tab active" href="/admin/galerias/">Galerias</a>
    </nav>

    <main class="private-admin gallery-library">
      <section class="library-hero">
        <div>
          <span class="eyebrow">Entrega privada</span>
          <h1>Galerias</h1>
          <p>Escolha uma galeria para abrir o painel de fotos, upload, preços e configurações.</p>
        </div>
        <button class="icon-btn" id="refreshBtn" type="button" title="Atualizar">↻</button>
      </section>

      <section class="library-toolbar" aria-label="Criar galeria">
        <label for="quickTitle">
          Nova galeria
          <span>Crie a galeria aqui; os detalhes serão editados na próxima página.</span>
        </label>
        <div class="inline-form">
          <input id="quickTitle" type="text" placeholder="Ex: Beatriz Formatura">
          <button class="btn btn-primary" id="quickCreateBtn" type="button">Criar galeria</button>
        </div>
      </section>

      <section class="gallery-card-grid" id="galleryList" aria-label="Galerias disponíveis"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/theme.js?v=20260707-02"></script>
  <script src="/admin/galerias/lista.js?v=20260707-02"></script>
</body>
</html>
