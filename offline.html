<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0e0f">
  <title>Sem conexão | Marcel Conde</title>
  <link rel="icon" href="/images/favicon.png">
  <style>
    :root { color-scheme: dark; --bg: #0d0e0f; --ink: #ecebe7; --muted: #8f8e89; --gold: #c8aa80; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    body {
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { display: grid; gap: 14px; justify-items: center; max-width: 360px; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { margin: 6px 0 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    button {
      margin-top: 8px;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: var(--gold);
      color: #1b1710;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid rgba(200, 170, 128, 0.5); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/images/app-icon-192.png" alt="">
    <h1>Você está sem internet</h1>
    <p>Assim que a conexão voltar, toque em “Tentar de novo” para continuar de onde parou.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
